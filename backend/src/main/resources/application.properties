spring.application.name=athletix
spring.profiles.active=dev
server.port=${ATHLETIX_SERVER_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Em uma demonstração exposta por HTTPS, defina ATHLETIX_COOKIE_SECURE=true.
server.servlet.session.cookie.secure=${ATHLETIX_COOKIE_SECURE:false}

# Interface local de exploração. O contrato versionado permanece em docs/api/openapi.yaml.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# SMTP real: informe as credenciais apenas por variáveis de ambiente. Sem SMTP configurado,
# solicitações de credencial não confirmam entrega e não persistem novos tokens.
spring.mail.host=${ATHLETIX_SMTP_HOST:}
spring.mail.port=${ATHLETIX_SMTP_PORT:587}
spring.mail.username=${ATHLETIX_SMTP_USERNAME:}
spring.mail.password=${ATHLETIX_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${ATHLETIX_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${ATHLETIX_SMTP_STARTTLS:true}
athletix.frontend-base-url=${ATHLETIX_FRONTEND_BASE_URL:http://localhost:5173}
athletix.mail-from=${ATHLETIX_MAIL_FROM:no-reply@athletix.local}

# Rotina de avisos de prazo (B15): intervalo entre execuções e espera após subir a aplicação
athletix.notificacoes.intervalo-ms=${ATHLETIX_NOTIFICACOES_INTERVALO_MS:3600000}
athletix.notificacoes.atraso-inicial-ms=${ATHLETIX_NOTIFICACOES_ATRASO_INICIAL_MS:60000}

# B18: limites de upload e orçamento de BLOBs privados por atlética.
spring.servlet.multipart.max-file-size=${ATHLETIX_ARQUIVOS_MAX_TAMANHO:10485760B}
spring.servlet.multipart.max-request-size=${ATHLETIX_ARQUIVOS_MAX_REQUISICAO:10485760B}
athletix.arquivos.max-tamanho-bytes=${ATHLETIX_ARQUIVOS_MAX_TAMANHO_BYTES:10485760}
athletix.arquivos.orcamento-por-atletica-bytes=${ATHLETIX_ARQUIVOS_ORCAMENTO_POR_ATLETICA_BYTES:104857600}

server.servlet.context-path=/api/v1
