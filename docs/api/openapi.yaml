openapi: 3.0.3
info:
  title: Athletix API
  version: v1
  description: >-
    Contratos compartilhados da API. Os caminhos de cada domínio serão documentados
    nesta especificação ao serem implementados.
servers:
  - url: /api/v1
    description: Base local da API
paths:
  /auth/csrf:
    get:
      summary: Obtém o token CSRF da sessão
      operationId: getCsrf
      responses:
        '200':
          description: Token CSRF para ser enviado no cabeçalho informado nas operações mutáveis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
  /auth/login:
    post:
      summary: Autentica com e-mail e senha e inicia sessão
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessão autenticada e vínculos ativos disponíveis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/logout:
    post:
      summary: Encerra a sessão atual
      operationId: logout
      responses:
        '204':
          description: Sessão encerrada.
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/me:
    get:
      summary: Retorna a conta, vínculos ativos e capacidades da sessão
      operationId: getCurrentSession
      responses:
        '200':
          description: Estado atual da sessão.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/selecionar-atletica:
    post:
      summary: Seleciona um vínculo ativo da própria conta
      operationId: selectAtletica
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelecionarAtleticaRequest'
      responses:
        '200':
          description: Estado da sessão com a atlética selecionada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  schemas:
    ApiError:
      type: object
      required: [status, code, message, fieldErrors, path, timestamp]
      properties:
        status:
          type: integer
          example: 400
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: A requisição contém dados inválidos.
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        path:
          type: string
          example: /api/v1/membros
        timestamp:
          type: string
          format: date-time
          example: '2026-11-08T18:00:00Z'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: nome
        message:
          type: string
          example: O nome é obrigatório.
    PageResponse:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
          minimum: 0
          example: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        totalItems:
          type: integer
          format: int64
          example: 42
        totalPages:
          type: integer
          example: 3
    VersionedUpdate:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
          example: 3
    MonetaryValue:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      example: '1250.90'
    Cnpj:
      type: string
      description: CNPJ opcional, normalizado para 14 dígitos quando informado.
      pattern: '^\d{14}$'
      example: '11222333000181'
    TimeZone:
      type: string
      description: Identificador IANA do fuso horário da atlética.
      example: America/Sao_Paulo
    Atletica:
      type: object
      required: [id, nome, fusoHorario, ativa, version, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nome:
          type: string
          maxLength: 120
        sigla:
          type: string
          maxLength: 20
          nullable: true
        instituicao:
          type: string
          maxLength: 160
          nullable: true
        cnpj:
          allOf:
            - $ref: '#/components/schemas/Cnpj'
          nullable: true
        fusoHorario:
          $ref: '#/components/schemas/TimeZone'
        ativa:
          type: boolean
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DominioEmailPermitido:
      type: object
      required: [id, atleticaId, dominio]
      properties:
        id:
          type: integer
          format: int64
        atleticaId:
          type: integer
          format: int64
        dominio:
          type: string
          description: Domínio normalizado e comparado por igualdade exata.
          pattern: '^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
          example: engenharia.exemplo.edu.br
    PerfilAcesso:
      type: string
      enum: [ADMINISTRADOR, FINANCEIRO, GESTOR, MEMBRO]
    Cargo:
      type: object
      required: [id, atleticaId, nome, perfilAcesso, ativo, version, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        atleticaId:
          type: integer
          format: int64
        nome:
          type: string
          maxLength: 100
        descricao:
          type: string
          maxLength: 500
          nullable: true
        perfilAcesso:
          $ref: '#/components/schemas/PerfilAcesso'
        ativo:
          type: boolean
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SituacaoDepartamento:
      type: string
      enum: [EM_CONFIGURACAO, ATIVO, INATIVO]
    Departamento:
      type: object
      description: A contagem de membros é calculada pelos vínculos e não é persistida neste recurso.
      required: [id, atleticaId, nome, situacao, version, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        atleticaId:
          type: integer
          format: int64
        nome:
          type: string
          maxLength: 100
        descricao:
          type: string
          maxLength: 1000
          nullable: true
        responsavelMembroId:
          type: integer
          format: int64
          nullable: true
          description: Referência provisória; a integridade com Membro será concluída em B05.
        situacao:
          $ref: '#/components/schemas/SituacaoDepartamento'
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Usuario:
      type: object
      description: Resposta segura de identidade; não inclui senhaHash, senha ou tokens.
      required: [id, nome, email, credencialAtiva, version, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
          minLength: 3
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        telefone:
          type: string
          maxLength: 20
          nullable: true
          example: '+5511999999999'
        credencialAtiva:
          type: boolean
        ultimoAcessoEm:
          type: string
          format: date-time
          nullable: true
        senhaAlteradaEm:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StatusMembro:
      type: string
      enum: [PENDENTE, ATIVO, INATIVO]
    Membro:
      type: object
      required: [id, atleticaId, usuarioId, curso, cargoId, departamentoId, status, membroDesde, version, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        atleticaId:
          type: integer
          format: int64
        usuarioId:
          type: integer
          format: int64
        curso:
          type: string
          maxLength: 160
        periodoCurso:
          type: integer
          minimum: 1
          maximum: 30
          nullable: true
        cargoId:
          type: integer
          format: int64
        departamentoId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/StatusMembro'
        membroDesde:
          type: string
          format: date
        ativadoEm:
          type: string
          format: date-time
          nullable: true
        inativadoEm:
          type: string
          format: date-time
          nullable: true
        validadoPorMembroId:
          type: integer
          format: int64
          nullable: true
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: admin@athletix.local
        senha:
          type: string
          format: password
          minLength: 10
          maxLength: 64
          writeOnly: true
    SelecionarAtleticaRequest:
      type: object
      required: [membroId]
      properties:
        membroId:
          type: integer
          format: int64
          minimum: 1
    CsrfResponse:
      type: object
      required: [token, headerName, parameterName]
      properties:
        token:
          type: string
          description: Token efêmero que também é entregue no cookie XSRF-TOKEN.
        headerName:
          type: string
          example: X-XSRF-TOKEN
        parameterName:
          type: string
          example: _csrf
    Capacidade:
      type: string
      enum:
        - CONSULTAR_MEMBROS
        - CONSULTAR_MEMBROS_DADOS_MINIMOS
        - CONSULTAR_DEPARTAMENTOS
        - GERENCIAR_MEMBROS
        - CONFIGURAR_ESTRUTURA
        - GERENCIAR_EVENTOS_E_TAREFAS
        - GERENCIAR_EVENTOS_DO_PROPRIO_ESCOPO
        - ATUALIZAR_PROPRIA_TAREFA
        - CONSULTAR_RESUMOS_FINANCEIROS
        - GERENCIAR_FINANCEIRO
        - GERENCIAR_PATRIMONIO
        - GERENCIAR_PATRIMONIO_DO_PROPRIO_DEPARTAMENTO
        - CONSULTAR_DOCUMENTOS_MEMBROS
        - CONSULTAR_DOCUMENTOS_DIRETORIA
        - PUBLICAR_DOCUMENTOS
        - CONCLUIR_TRANSFERENCIA_GESTAO
    VinculoAtletica:
      type: object
      required: [membroId, atleticaId, atleticaNome, departamentoId, perfilAcesso]
      properties:
        membroId:
          type: integer
          format: int64
        atleticaId:
          type: integer
          format: int64
        atleticaNome:
          type: string
        departamentoId:
          type: integer
          format: int64
        perfilAcesso:
          $ref: '#/components/schemas/PerfilAcesso'
    AuthState:
      type: object
      description: Não contém senha, hash, token de sessão ou vínculos inativos.
      required: [usuario, vinculosAtivos, selecaoNecessaria, capacidades]
      properties:
        usuario:
          $ref: '#/components/schemas/Usuario'
        vinculosAtivos:
          type: array
          items:
            $ref: '#/components/schemas/VinculoAtletica'
        membroSelecionadoId:
          type: integer
          format: int64
          nullable: true
        selecaoNecessaria:
          type: boolean
        capacidades:
          type: array
          items:
            $ref: '#/components/schemas/Capacidade'
  responses:
    InvalidRequest:
      description: Entrada inválida ou regra de negócio violada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthenticated:
      description: A sessão não foi autenticada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: A sessão não tem permissão para a operação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Recurso inexistente ou indisponível para a atlética da sessão.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Conflito de dados ou versão desatualizada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
