openapi: 3.0.3
info:
  title: Athletix API
  version: v1
  description: >-
    Contratos compartilhados da API. Os caminhos de cada domínio serão documentados
    nesta especificação ao serem implementados.
servers:
  - url: /api/v1
    description: Base local da API
paths:
  /auth/csrf:
    get:
      summary: Obtém o token CSRF da sessão
      operationId: getCsrf
      responses:
        '200':
          description: Token CSRF para ser enviado no cabeçalho informado nas operações mutáveis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
  /auth/login:
    post:
      summary: Autentica com e-mail e senha e inicia sessão
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessão autenticada e vínculos ativos disponíveis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/logout:
    post:
      summary: Encerra a sessão atual
      operationId: logout
      responses:
        '204':
          description: Sessão encerrada.
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/me:
    get:
      summary: Retorna a conta, vínculos ativos e capacidades da sessão
      operationId: getCurrentSession
      responses:
        '200':
          description: Estado atual da sessão.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/selecionar-atletica:
    post:
      summary: Seleciona um vínculo ativo da própria conta
      operationId: selectAtletica
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelecionarAtleticaRequest'
      responses:
        '200':
          description: Estado da sessão com a atlética selecionada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/esqueci-senha:
    post:
      summary: Solicita instruções de recuperação de senha
      operationId: forgotPassword
      description: >-
        Sempre retorna a mesma mensagem, independentemente da existência ou elegibilidade
        da conta. Nunca retorna token ou link de recuperação.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EsqueciSenhaRequest'
      responses:
        '200':
          description: Solicitação processada sem revelar a existência da conta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemResponse'
  /auth/redefinir-senha:
    post:
      summary: Redefine uma senha usando token de recuperação
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedefinirSenhaRequest'
      responses:
        '200':
          description: Senha redefinida; as sessões anteriores da conta foram invalidadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /auth/definir-senha:
    post:
      summary: Define a senha inicial usando token de convite
      operationId: setPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedefinirSenhaRequest'
      responses:
        '200':
          description: Senha inicial definida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /membros:
    get:
      summary: Lista os membros da atlética selecionada
      operationId: listMembros
      description: >-
        Pesquisa sem distinção de caixa por nome, e-mail ou curso. Aceita somente
        `sort=nome|email|curso|status|cargo|departamento|membroDesde,direcao`;
        `direcao` é `asc` ou `desc`. Administradores recebem contato; os demais
        perfis autorizados não recebem e-mail ou telefone.
      parameters:
        - $ref: '#/components/parameters/BuscaMembro'
        - $ref: '#/components/parameters/DepartamentoId'
        - $ref: '#/components/parameters/StatusMembroFiltro'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/SortMembro'
      responses:
        '200':
          description: Página estável de membros no escopo da sessão.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMembroResumo'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Cadastra um vínculo pendente de membro
      operationId: createMembro
      description: >-
        Exclusivo de administrador. O status é sempre PENDENTE. Se o e-mail já
        existir globalmente, os dados pessoais recebidos não alteram a conta existente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembroCadastroRequest'
      responses:
        '201':
          description: Vínculo pendente criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembroResumo'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /membros/{id}:
    get:
      summary: Consulta um membro da atlética selecionada
      operationId: getMembro
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Membro encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembroResumo'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Altera dados do vínculo de membro
      operationId: updateMembro
      description: Exclusivo de administrador; não altera a identidade global da conta.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembroUpdateRequest'
      responses:
        '200':
          description: Vínculo alterado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembroResumo'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /membros/{id}/aprovar:
    patch:
      summary: Aprova um membro pendente
      operationId: approveMembro
      description: Requer credencial definida, atlética ativa e um validador elegível, salvo o primeiro membro de departamento em configuração.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembroActivationRequest'
      responses:
        '200':
          description: Membro ativado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembroResumo'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /membros/{id}/inativar:
    patch:
      summary: Inativa um membro ativo sem apagar seu histórico
      operationId: deactivateMembro
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembroInactivationRequest'
      responses:
        '200':
          description: Membro inativado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembroResumo'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /membros/exportacao:
    get:
      summary: Exporta todos os membros filtrados em CSV UTF-8
      operationId: exportMembros
      description: >-
        Exclusivo de administrador. Usa os mesmos filtros e ordenações da listagem,
        mas não é limitado pela página visível. Células são escapadas e valores que
        iniciam fórmula de planilha são neutralizados.
      parameters:
        - $ref: '#/components/parameters/BuscaMembro'
        - $ref: '#/components/parameters/DepartamentoId'
        - $ref: '#/components/parameters/StatusMembroFiltro'
        - $ref: '#/components/parameters/SortMembro'
      responses:
        '200':
          description: Arquivo CSV UTF-8.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
  /cargos:
    get:
      summary: Lista cargos da atlética selecionada
      operationId: listCargos
      responses:
        '200':
          description: Cargos, inclusive os inativos, visíveis à administração.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cargo'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Cria um cargo
      operationId: createCargo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CargoCreateRequest'
      responses:
        '201':
          description: Cargo criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cargo'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /cargos/{id}:
    put:
      summary: Atualiza ou inativa um cargo
      operationId: updateCargo
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CargoUpdateRequest'
      responses:
        '200':
          description: Cargo atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cargo'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /departamentos:
    get:
      summary: Lista departamentos da atlética selecionada
      operationId: listDepartamentos
      description: Administração também recebe departamentos em configuração; os demais perfis recebem apenas a estrutura ativa.
      responses:
        '200':
          description: Departamentos com responsável e contagem derivada de membros ativos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Departamento'
    post:
      summary: Cria departamento em configuração
      operationId: createDepartamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartamentoCreateRequest'
      responses:
        '201':
          description: Departamento criado em configuração.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamento'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /departamentos/{id}:
    get:
      summary: Consulta um departamento da atlética selecionada
      operationId: getDepartamento
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Departamento encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamento'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Atualiza dados básicos de departamento
      operationId: updateDepartamento
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartamentoUpdateRequest'
      responses:
        '200':
          description: Departamento atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamento'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /departamentos/{id}/responsavel:
    patch:
      summary: Define o responsável do departamento
      operationId: assignDepartamentoResponsavel
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsavelDepartamentoUpdateRequest'
      responses:
        '200':
          description: Responsável definido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamento'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /departamentos/{id}/ativar:
    patch:
      summary: Ativa departamento em configuração
      operationId: activateDepartamento
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartamentoTransitionRequest'
      responses:
        '200':
          description: Departamento ativado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamento'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /departamentos/{id}/inativar:
    patch:
      summary: Inativa departamento sem apagar histórico
      operationId: deactivateDepartamento
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartamentoTransitionRequest'
      responses:
        '200':
          description: Departamento inativado após transferências e substituições exigidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamento'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /perfil:
    get:
      summary: Consulta o perfil do vínculo selecionado
      operationId: getPerfil
      responses:
        '200':
          description: Perfil com e-mail somente leitura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
    put:
      summary: Atualiza nome, telefone, curso e período do próprio perfil
      operationId: updatePerfil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerfilUpdateRequest'
      responses:
        '200':
          description: Perfil atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /perfil/senha:
    put:
      summary: Troca a senha atual e invalida outras sessões da conta
      operationId: updatePerfilSenha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerfilSenhaUpdateRequest'
      responses:
        '204':
          description: Senha alterada.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /perfil/atividades:
    get:
      summary: Lista o histórico de atividades do usuário na atlética selecionada
      operationId: listPerfilAtividades
      description: "Ordenações permitidas: `ocorridaEm`, `acao` e `tipoRecurso`."
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/SortAtividade'
      responses:
        '200':
          description: Página de atividades imutáveis, sem segredos ou conteúdo integral de documentos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageAtividadeUsuario'
  /perfil/solicitacoes-vinculo:
    post:
      summary: Solicita troca de cargo ou departamento do próprio vínculo
      operationId: createSolicitacaoAlteracaoVinculo
      description: A solicitação não altera o vínculo até aprovação administrativa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitacaoAlteracaoVinculoCreateRequest'
      responses:
        '201':
          description: Solicitação pendente criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitacaoAlteracaoVinculo'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /membros/solicitacoes-vinculo:
    get:
      summary: Lista solicitações de alteração de vínculo da atlética
      operationId: listSolicitacoesAlteracaoVinculo
      description: Exclusivo de administrador; aceita filtro opcional `status`.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/StatusSolicitacaoAlteracaoVinculo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de solicitações da atlética atual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageSolicitacaoAlteracaoVinculo'
        '403':
          $ref: '#/components/responses/Forbidden'
  /membros/solicitacoes-vinculo/{id}/decisao:
    patch:
      summary: Aprova ou rejeita solicitação de alteração de vínculo
      operationId: decideSolicitacaoAlteracaoVinculo
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitacaoAlteracaoVinculoDecisaoRequest'
      responses:
        '200':
          description: Solicitação avaliada; ao aprovar, o vínculo foi atualizado atomicamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitacaoAlteracaoVinculo'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /gestoes:
    get:
      summary: Lista as gestões da atlética selecionada
      operationId: listGestoes
      description: A consulta é histórica e administrativa; uma gestão encerrada não restaura privilégios antigos.
      responses:
        '200':
          description: Gestões ordenadas por início, da mais recente para a mais antiga.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Gestao'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Cria uma gestão planejada
      operationId: createGestao
      description: A ativação é uma transição administrativa posterior e não é exposta nesta etapa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GestaoCreateRequest'
      responses:
        '201':
          description: Gestão criada com status PLANEJADA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gestao'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /gestoes/{id}:
    get:
      summary: Consulta uma gestão no escopo da atlética selecionada
      operationId: getGestao
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Gestão encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gestao'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /eventos:
    get:
      summary: Lista eventos no escopo da atlética selecionada
      operationId: listEventos
      description: >-
        Pesquisa por nome e filtra eventos que se sobrepõem ao intervalo informado. As contagens das abas
        usam os filtros de busca, data e gestão, sem aplicar o filtro `status` ou `grupoStatus` da própria aba.
      parameters:
        - name: busca
          in: query
          schema:
            type: string
        - name: inicioDe
          in: query
          schema:
            type: string
            format: date-time
        - name: inicioAte
          in: query
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/StatusEvento'
        - name: grupoStatus
          in: query
          schema:
            $ref: '#/components/schemas/GrupoStatusEvento'
        - name: gestaoId
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/SortEvento'
      responses:
        '200':
          description: Página de eventos e contagens consistentes para as abas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageEvento'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Cria um evento planejado
      operationId: createEvento
      description: Exclusivo de administrador nesta etapa. A origem é a gestão ativa do servidor, quando houver.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventoCreateRequest'
      responses:
        '201':
          description: Evento criado com status PLANEJADO.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /eventos/{id}:
    get:
      summary: Consulta um evento da atlética selecionada
      operationId: getEvento
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Evento encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Atualiza os dados de um evento
      operationId: updateEvento
      description: Exclusivo de administrador; a transição de status usa a rota própria.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventoUpdateRequest'
      responses:
        '200':
          description: Evento atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /eventos/{id}/status:
    patch:
      summary: Transiciona ou corrige o status de um evento
      operationId: updateEventoStatus
      description: >-
        Avanços seguem PLANEJADO → INSCRICOES_ABERTAS/EM_ANDAMENTO → CONCLUIDO. Uma volta para
        status anterior exige administrador e `motivoCorrecao`; não existe status de cancelamento nesta API.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventoStatusUpdateRequest'
      responses:
        '200':
          description: Status atualizado e atividade registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /eventos/{eventoId}/participacoes:
    get:
      summary: Lista participações de um evento
      operationId: listParticipacoesEvento
      description: >-
        Restrito ao organizador (membro criador) ou à administração. Nunca é entregue a participantes comuns,
        pois pode conter nome e e-mail de convidados externos. Ordenações: `status` e `inscritoEm`.
      parameters:
        - $ref: '#/components/parameters/EventoId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/SortParticipacaoEvento'
      responses:
        '200':
          description: Página de participações do evento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageParticipacaoEvento'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Adiciona participante interno ou externo
      operationId: createParticipacaoEvento
      description: >-
        Para membro interno, informe somente `membroId`. Para externo, informe somente nome e e-mail;
        o e-mail é normalizado e não cria uma conta.
      parameters:
        - $ref: '#/components/parameters/EventoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipacaoEventoCreateRequest'
      responses:
        '201':
          description: Participação criada como INSCRITO.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipacaoEvento'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /eventos/{eventoId}/participacoes/{participacaoId}/status:
    patch:
      summary: Transiciona o status de uma participação
      operationId: updateParticipacaoEventoStatus
      description: >-
        Segue INSCRITO → CONFIRMADO → PRESENTE. CANCELADO preserva a participação. A correção
        PRESENTE → CONFIRMADO exige `motivoCorrecao` e fica auditada.
      parameters:
        - $ref: '#/components/parameters/EventoId'
        - name: participacaoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipacaoEventoStatusUpdateRequest'
      responses:
        '200':
          description: Participação atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipacaoEvento'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /eventos/{eventoId}/participacoes/resumo:
    get:
      summary: Consulta totais cumulativos de participação
      operationId: getParticipacoesEventoResumo
      description: >-
        `inscritos` soma INSCRITO, CONFIRMADO e PRESENTE; `confirmados` soma CONFIRMADO e PRESENTE;
        `presentes` conta apenas PRESENTE. Os números não representam pessoas adicionais em cada estágio.
      parameters:
        - $ref: '#/components/parameters/EventoId'
      responses:
        '200':
          description: Resumo de previsão e participação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipacaoEventoResumo'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    ApiError:
      type: object
      required: [status, code, message, fieldErrors, path, timestamp]
      properties:
        status:
          type: integer
          example: 400
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: A requisição contém dados inválidos.
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        path:
          type: string
          example: /api/v1/membros
        timestamp:
          type: string
          format: date-time
          example: '2026-11-08T18:00:00Z'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: nome
        message:
          type: string
          example: O nome é obrigatório.
    PageResponse:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
          minimum: 0
          example: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        totalItems:
          type: integer
          format: int64
          example: 42
        totalPages:
          type: integer
          example: 3
    VersionedUpdate:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
          example: 3
    MonetaryValue:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      example: '1250.90'
    Cnpj:
      type: string
      description: CNPJ opcional, normalizado para 14 dígitos quando informado.
      pattern: '^\d{14}$'
      example: '11222333000181'
    TimeZone:
      type: string
      description: Identificador IANA do fuso horário da atlética.
      example: America/Sao_Paulo
    Atletica:
      type: object
      required: [id, nome, fusoHorario, ativa, version, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nome:
          type: string
          maxLength: 120
        sigla:
          type: string
          maxLength: 20
          nullable: true
        instituicao:
          type: string
          maxLength: 160
          nullable: true
        cnpj:
          allOf:
            - $ref: '#/components/schemas/Cnpj'
          nullable: true
        fusoHorario:
          $ref: '#/components/schemas/TimeZone'
        ativa:
          type: boolean
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DominioEmailPermitido:
      type: object
      required: [id, atleticaId, dominio]
      properties:
        id:
          type: integer
          format: int64
        atleticaId:
          type: integer
          format: int64
        dominio:
          type: string
          description: Domínio normalizado e comparado por igualdade exata.
          pattern: '^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
          example: engenharia.exemplo.edu.br
    PerfilAcesso:
      type: string
      enum: [ADMINISTRADOR, FINANCEIRO, GESTOR, MEMBRO]
    Cargo:
      type: object
      required: [id, atleticaId, nome, perfilAcesso, ativo, version, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        atleticaId:
          type: integer
          format: int64
        nome:
          type: string
          maxLength: 100
        descricao:
          type: string
          maxLength: 500
          nullable: true
        perfilAcesso:
          $ref: '#/components/schemas/PerfilAcesso'
        ativo:
          type: boolean
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SituacaoDepartamento:
      type: string
      enum: [EM_CONFIGURACAO, ATIVO, INATIVO]
    Departamento:
      type: object
      description: A contagem de membros é calculada pelos vínculos e não é persistida neste recurso.
      required: [id, atleticaId, nome, situacao, version, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        atleticaId:
          type: integer
          format: int64
        nome:
          type: string
          maxLength: 100
        descricao:
          type: string
          maxLength: 1000
          nullable: true
        responsavelMembroId:
          type: integer
          format: int64
          nullable: true
          description: Membro ativo da mesma atlética e departamento.
        responsavelNome:
          type: string
          nullable: true
        quantidadeMembros:
          type: integer
          format: int64
          minimum: 0
          description: Contagem derivada de vínculos ATIVO; não é persistida.
        situacao:
          $ref: '#/components/schemas/SituacaoDepartamento'
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Usuario:
      type: object
      description: Resposta segura de identidade; não inclui senhaHash, senha ou tokens.
      required: [id, nome, email, credencialAtiva, version, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
          minLength: 3
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        telefone:
          type: string
          maxLength: 20
          nullable: true
          example: '+5511999999999'
        credencialAtiva:
          type: boolean
        ultimoAcessoEm:
          type: string
          format: date-time
          nullable: true
        senhaAlteradaEm:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StatusMembro:
      type: string
      enum: [PENDENTE, ATIVO, INATIVO]
    Membro:
      type: object
      required: [id, atleticaId, usuarioId, curso, cargoId, departamentoId, status, membroDesde, version, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        atleticaId:
          type: integer
          format: int64
        usuarioId:
          type: integer
          format: int64
        curso:
          type: string
          maxLength: 160
        periodoCurso:
          type: integer
          minimum: 1
          maximum: 30
          nullable: true
        cargoId:
          type: integer
          format: int64
        departamentoId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/StatusMembro'
        membroDesde:
          type: string
          format: date
        ativadoEm:
          type: string
          format: date-time
          nullable: true
        inativadoEm:
          type: string
          format: date-time
          nullable: true
        validadoPorMembroId:
          type: integer
          format: int64
          nullable: true
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MembroResumo:
      type: object
      description: >-
        Resposta de diretório. `email` e `telefone` são nulos para perfis que não
        precisam de dados de contato; credenciais nunca são expostas.
      required: [id, usuarioId, nome, curso, cargoId, cargo, departamentoId, departamento, status, membroDesde, version]
      properties:
        id:
          type: integer
          format: int64
        usuarioId:
          type: integer
          format: int64
        nome:
          type: string
        email:
          type: string
          format: email
          nullable: true
        telefone:
          type: string
          nullable: true
        curso:
          type: string
        periodoCurso:
          type: integer
          minimum: 1
          maximum: 30
          nullable: true
        cargoId:
          type: integer
          format: int64
        cargo:
          type: string
        departamentoId:
          type: integer
          format: int64
        departamento:
          type: string
        status:
          $ref: '#/components/schemas/StatusMembro'
        membroDesde:
          type: string
          format: date
        ativadoEm:
          type: string
          format: date-time
          nullable: true
        inativadoEm:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          format: int64
    PageMembroResumo:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MembroResumo'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
    MembroCadastroRequest:
      type: object
      required: [nome, email, curso, cargoId, departamentoId]
      properties:
        nome:
          type: string
          minLength: 3
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        telefone:
          type: string
          maxLength: 20
          nullable: true
        curso:
          type: string
          maxLength: 160
        periodoCurso:
          type: integer
          minimum: 1
          maximum: 30
          nullable: true
        cargoId:
          type: integer
          format: int64
          minimum: 1
        departamentoId:
          type: integer
          format: int64
          minimum: 1
        membroDesde:
          type: string
          format: date
          nullable: true
    MembroUpdateRequest:
      allOf:
        - type: object
          required: [curso, cargoId, departamentoId]
          properties:
            curso:
              type: string
              maxLength: 160
            periodoCurso:
              type: integer
              minimum: 1
              maximum: 30
              nullable: true
            cargoId:
              type: integer
              format: int64
              minimum: 1
            departamentoId:
              type: integer
              format: int64
              minimum: 1
        - $ref: '#/components/schemas/VersionedUpdate'
    MembroActivationRequest:
      allOf:
        - type: object
          properties:
            validadoPorMembroId:
              type: integer
              format: int64
              minimum: 1
              nullable: true
        - $ref: '#/components/schemas/VersionedUpdate'
    MembroInactivationRequest:
      $ref: '#/components/schemas/VersionedUpdate'
    CargoCreateRequest:
      type: object
      required: [nome, perfilAcesso, ativo]
      properties:
        nome:
          type: string
          maxLength: 100
        descricao:
          type: string
          maxLength: 500
          nullable: true
        perfilAcesso:
          $ref: '#/components/schemas/PerfilAcesso'
        ativo:
          type: boolean
    CargoUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/CargoCreateRequest'
        - $ref: '#/components/schemas/VersionedUpdate'
    DepartamentoCreateRequest:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
          maxLength: 100
        descricao:
          type: string
          maxLength: 1000
          nullable: true
    DepartamentoUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/DepartamentoCreateRequest'
        - $ref: '#/components/schemas/VersionedUpdate'
    DepartamentoTransitionRequest:
      $ref: '#/components/schemas/VersionedUpdate'
    ResponsavelDepartamentoUpdateRequest:
      allOf:
        - type: object
          required: [responsavelMembroId]
          properties:
            responsavelMembroId:
              type: integer
              format: int64
              minimum: 1
        - $ref: '#/components/schemas/VersionedUpdate'
    Perfil:
      type: object
      required: [usuarioId, nome, email, membroId, curso, cargoId, departamentoId, usuarioVersion, membroVersion]
      properties:
        usuarioId:
          type: integer
          format: int64
        nome:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          readOnly: true
        telefone:
          type: string
          nullable: true
          maxLength: 20
        membroId:
          type: integer
          format: int64
        curso:
          type: string
          maxLength: 160
        periodoCurso:
          type: integer
          minimum: 1
          maximum: 30
          nullable: true
        cargoId:
          type: integer
          format: int64
        cargo:
          type: string
        departamentoId:
          type: integer
          format: int64
        departamento:
          type: string
        usuarioVersion:
          type: integer
          format: int64
        membroVersion:
          type: integer
          format: int64
    PerfilUpdateRequest:
      type: object
      required: [nome, curso, usuarioVersion, membroVersion]
      properties:
        nome:
          type: string
          minLength: 3
          maxLength: 120
        telefone:
          type: string
          maxLength: 20
          nullable: true
        curso:
          type: string
          maxLength: 160
        periodoCurso:
          type: integer
          minimum: 1
          maximum: 30
          nullable: true
        usuarioVersion:
          type: integer
          format: int64
          minimum: 0
        membroVersion:
          type: integer
          format: int64
          minimum: 0
    PerfilSenhaUpdateRequest:
      type: object
      required: [senhaAtual, novaSenha, version]
      properties:
        senhaAtual:
          type: string
          format: password
          writeOnly: true
        novaSenha:
          type: string
          format: password
          minLength: 10
          maxLength: 64
          writeOnly: true
        version:
          type: integer
          format: int64
          minimum: 0
    AtividadeUsuario:
      type: object
      description: Registro imutável criado pelo servidor; não contém senhas, tokens nem documentos completos.
      required: [id, acao, tipoRecurso, resumo, ocorridaEm]
      properties:
        id:
          type: integer
          format: int64
        acao:
          type: string
        tipoRecurso:
          type: string
        recursoId:
          type: integer
          format: int64
          nullable: true
        resumo:
          type: string
          maxLength: 500
        ocorridaEm:
          type: string
          format: date-time
        gestaoId:
          type: integer
          format: int64
          nullable: true
    PageAtividadeUsuario:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AtividadeUsuario'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
    StatusSolicitacaoAlteracaoVinculo:
      type: string
      enum: [PENDENTE, APROVADA, REJEITADA]
    SolicitacaoAlteracaoVinculo:
      type: object
      required: [id, membroId, cargoPretendidoId, departamentoPretendidoId, cargoAnteriorId, departamentoAnteriorId, motivo, status, version]
      properties:
        id:
          type: integer
          format: int64
        membroId:
          type: integer
          format: int64
        cargoPretendidoId:
          type: integer
          format: int64
        cargoPretendido:
          type: string
        departamentoPretendidoId:
          type: integer
          format: int64
        departamentoPretendido:
          type: string
        cargoAnteriorId:
          type: integer
          format: int64
        departamentoAnteriorId:
          type: integer
          format: int64
        motivo:
          type: string
          maxLength: 500
        status:
          $ref: '#/components/schemas/StatusSolicitacaoAlteracaoVinculo'
        avaliadaEm:
          type: string
          format: date-time
          nullable: true
        avaliadaPorMembroId:
          type: integer
          format: int64
          nullable: true
        observacaoAvaliacao:
          type: string
          maxLength: 500
          nullable: true
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PageSolicitacaoAlteracaoVinculo:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SolicitacaoAlteracaoVinculo'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
    SolicitacaoAlteracaoVinculoCreateRequest:
      type: object
      required: [cargoPretendidoId, departamentoPretendidoId, motivo]
      properties:
        cargoPretendidoId:
          type: integer
          format: int64
          minimum: 1
        departamentoPretendidoId:
          type: integer
          format: int64
          minimum: 1
        motivo:
          type: string
          maxLength: 500
    SolicitacaoAlteracaoVinculoDecisaoRequest:
      type: object
      required: [decisao, version, membroVersion]
      properties:
        decisao:
          type: string
          enum: [APROVAR, REJEITAR]
        observacao:
          type: string
          maxLength: 500
          nullable: true
        version:
          type: integer
          format: int64
          minimum: 0
        membroVersion:
          type: integer
          format: int64
          minimum: 0
    StatusGestao:
      type: string
      enum: [PLANEJADA, ATIVA, ENCERRADA]
    Gestao:
      type: object
      required: [id, atleticaId, nome, dataInicio, dataFimPrevista, status, version, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        atleticaId:
          type: integer
          format: int64
        nome:
          type: string
          maxLength: 80
        dataInicio:
          type: string
          format: date
        dataFimPrevista:
          type: string
          format: date
        encerradaEm:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/StatusGestao'
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GestaoCreateRequest:
      type: object
      required: [nome, dataInicio, dataFimPrevista]
      properties:
        nome:
          type: string
          maxLength: 80
        dataInicio:
          type: string
          format: date
        dataFimPrevista:
          type: string
          format: date
    StatusEvento:
      type: string
      enum: [PLANEJADO, INSCRICOES_ABERTAS, EM_ANDAMENTO, CONCLUIDO]
    GrupoStatusEvento:
      type: string
      enum: [ATIVOS]
      description: ATIVOS contém INSCRICOES_ABERTAS e EM_ANDAMENTO.
    Evento:
      type: object
      required: [id, atleticaId, nome, inicio, fim, local, orcamentoPrevisto, status, criadoPorMembroId, version, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        atleticaId:
          type: integer
          format: int64
        gestaoOrigemId:
          type: integer
          format: int64
          nullable: true
        nome:
          type: string
          maxLength: 160
        descricao:
          type: string
          maxLength: 5000
          nullable: true
        inicio:
          type: string
          format: date-time
        fim:
          type: string
          format: date-time
        local:
          type: string
          maxLength: 200
        cidade:
          type: string
          maxLength: 120
          nullable: true
        uf:
          type: string
          pattern: '^[A-Z]{2}$'
          nullable: true
        orcamentoPrevisto:
          allOf:
            - $ref: '#/components/schemas/MonetaryValue'
          description: Decimal não negativo, com duas casas; zero representa evento gratuito.
        participantesEsperados:
          type: integer
          minimum: 0
          nullable: true
        status:
          $ref: '#/components/schemas/StatusEvento'
        criadoPorMembroId:
          type: integer
          format: int64
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PageEvento:
      type: object
      required: [items, page, size, totalItems, totalPages, contagensPorStatus, totalAtivos]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Evento'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
        contagensPorStatus:
          type: object
          additionalProperties:
            type: integer
            format: int64
        totalAtivos:
          type: integer
          format: int64
    EventoCreateRequest:
      type: object
      required: [nome, inicio, fim, local, orcamentoPrevisto]
      properties:
        nome:
          type: string
          maxLength: 160
        descricao:
          type: string
          maxLength: 5000
        inicio:
          type: string
          format: date-time
        fim:
          type: string
          format: date-time
        local:
          type: string
          maxLength: 200
        cidade:
          type: string
          maxLength: 120
        uf:
          type: string
          pattern: '^[A-Za-z]{2}$'
        orcamentoPrevisto:
          type: string
          example: '0.00'
        participantesEsperados:
          type: integer
          minimum: 0
    EventoUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/EventoCreateRequest'
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              format: int64
              minimum: 0
    EventoStatusUpdateRequest:
      type: object
      required: [status, version]
      properties:
        status:
          $ref: '#/components/schemas/StatusEvento'
        motivoCorrecao:
          type: string
          maxLength: 500
          nullable: true
        version:
          type: integer
          format: int64
          minimum: 0
    StatusParticipacaoEvento:
      type: string
      enum: [INSCRITO, CONFIRMADO, PRESENTE, CANCELADO]
    ParticipacaoEvento:
      type: object
      required: [id, atleticaId, eventoId, status, inscritoEm, version, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        atleticaId:
          type: integer
          format: int64
        eventoId:
          type: integer
          format: int64
        membroId:
          type: integer
          format: int64
          nullable: true
        nomeParticipante:
          type: string
          maxLength: 120
        emailParticipante:
          type: string
          format: email
          maxLength: 254
          nullable: true
          description: Disponível somente ao organizador ou administração; preenchido para participante externo.
        status:
          $ref: '#/components/schemas/StatusParticipacaoEvento'
        inscritoEm:
          type: string
          format: date-time
        confirmadoEm:
          type: string
          format: date-time
          nullable: true
        presencaEm:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PageParticipacaoEvento:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ParticipacaoEvento'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
    ParticipacaoEventoCreateRequest:
      type: object
      description: Informe `membroId` ou, para externo, `nomeParticipante` e `emailParticipante`, nunca ambos.
      properties:
        membroId:
          type: integer
          format: int64
          minimum: 1
        nomeParticipante:
          type: string
          maxLength: 120
        emailParticipante:
          type: string
          format: email
          maxLength: 254
    ParticipacaoEventoStatusUpdateRequest:
      type: object
      required: [status, version]
      properties:
        status:
          $ref: '#/components/schemas/StatusParticipacaoEvento'
        motivoCorrecao:
          type: string
          maxLength: 500
          nullable: true
        version:
          type: integer
          format: int64
          minimum: 0
    ParticipacaoEventoResumo:
      type: object
      required: [eventoId, inscritos, confirmados, presentes]
      properties:
        eventoId:
          type: integer
          format: int64
        participantesEsperados:
          type: integer
          minimum: 0
          nullable: true
          description: Previsão independente das contagens realizadas.
        inscritos:
          type: integer
          format: int64
          minimum: 0
          description: INSCRITO + CONFIRMADO + PRESENTE.
        confirmados:
          type: integer
          format: int64
          minimum: 0
          description: CONFIRMADO + PRESENTE.
        presentes:
          type: integer
          format: int64
          minimum: 0
          description: Apenas PRESENTE.
    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: admin@athletix.local
        senha:
          type: string
          format: password
          minLength: 10
          maxLength: 64
          writeOnly: true
    EsqueciSenhaRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          nullable: true
    RedefinirSenhaRequest:
      type: object
      required: [token, novaSenha]
      properties:
        token:
          type: string
          writeOnly: true
          description: Segredo recebido exclusivamente pelo link de e-mail.
        novaSenha:
          type: string
          format: password
          minLength: 10
          maxLength: 64
          writeOnly: true
    MensagemResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    FinalidadeTokenCredencial:
      type: string
      enum: [DEFINIR_SENHA, RECUPERAR_SENHA]
    TokenCredencial:
      type: object
      description: Metadados internos. O tokenHash e o valor original nunca são respostas HTTP.
      required: [id, usuarioId, finalidade, criadoEm, expiraEm]
      properties:
        id:
          type: integer
          format: int64
        usuarioId:
          type: integer
          format: int64
        membroId:
          type: integer
          format: int64
          nullable: true
        finalidade:
          $ref: '#/components/schemas/FinalidadeTokenCredencial'
        criadoEm:
          type: string
          format: date-time
        expiraEm:
          type: string
          format: date-time
        consumidoEm:
          type: string
          format: date-time
          nullable: true
    SelecionarAtleticaRequest:
      type: object
      required: [membroId]
      properties:
        membroId:
          type: integer
          format: int64
          minimum: 1
    CsrfResponse:
      type: object
      required: [token, headerName, parameterName]
      properties:
        token:
          type: string
          description: Token efêmero que também é entregue no cookie XSRF-TOKEN.
        headerName:
          type: string
          example: X-XSRF-TOKEN
        parameterName:
          type: string
          example: _csrf
    Capacidade:
      type: string
      enum:
        - CONSULTAR_MEMBROS
        - CONSULTAR_MEMBROS_DADOS_MINIMOS
        - CONSULTAR_DEPARTAMENTOS
        - GERENCIAR_MEMBROS
        - CONFIGURAR_ESTRUTURA
        - GERENCIAR_EVENTOS_E_TAREFAS
        - GERENCIAR_EVENTOS_DO_PROPRIO_ESCOPO
        - ATUALIZAR_PROPRIA_TAREFA
        - CONSULTAR_RESUMOS_FINANCEIROS
        - GERENCIAR_FINANCEIRO
        - GERENCIAR_PATRIMONIO
        - GERENCIAR_PATRIMONIO_DO_PROPRIO_DEPARTAMENTO
        - CONSULTAR_DOCUMENTOS_MEMBROS
        - CONSULTAR_DOCUMENTOS_DIRETORIA
        - PUBLICAR_DOCUMENTOS
        - CONCLUIR_TRANSFERENCIA_GESTAO
    VinculoAtletica:
      type: object
      required: [membroId, atleticaId, atleticaNome, departamentoId, perfilAcesso]
      properties:
        membroId:
          type: integer
          format: int64
        atleticaId:
          type: integer
          format: int64
        atleticaNome:
          type: string
        departamentoId:
          type: integer
          format: int64
        perfilAcesso:
          $ref: '#/components/schemas/PerfilAcesso'
    AuthState:
      type: object
      description: Não contém senha, hash, token de sessão ou vínculos inativos.
      required: [usuario, vinculosAtivos, selecaoNecessaria, capacidades]
      properties:
        usuario:
          $ref: '#/components/schemas/Usuario'
        vinculosAtivos:
          type: array
          items:
            $ref: '#/components/schemas/VinculoAtletica'
        membroSelecionadoId:
          type: integer
          format: int64
          nullable: true
        selecaoNecessaria:
          type: boolean
        capacidades:
          type: array
          items:
            $ref: '#/components/schemas/Capacidade'
  responses:
    InvalidRequest:
      description: Entrada inválida ou regra de negócio violada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthenticated:
      description: A sessão não foi autenticada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: A sessão não tem permissão para a operação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Recurso inexistente ou indisponível para a atlética da sessão.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Conflito de dados ou versão desatualizada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  parameters:
    EventoId:
      name: eventoId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    BuscaMembro:
      name: busca
      in: query
      description: Texto pesquisado sem distinção de caixa em nome, e-mail ou curso.
      schema:
        type: string
    DepartamentoId:
      name: departamentoId
      in: query
      schema:
        type: integer
        format: int64
        minimum: 1
    StatusMembroFiltro:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/StatusMembro'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SortMembro:
      name: sort
      in: query
      description: "Pode ser repetido. Campo permitido e direção: `nome`, `email`, `curso`, `status`, `cargo`, `departamento` ou `membroDesde`, com `asc` ou `desc`."
      schema:
        type: array
        items:
          type: string
          pattern: '^(nome|email|curso|status|cargo|departamento|membroDesde)(,(asc|desc|ASC|DESC))?$'
    SortAtividade:
      name: sort
      in: query
      description: "Pode ser repetido: `ocorridaEm`, `acao` ou `tipoRecurso`, com `asc` ou `desc`."
      schema:
        type: array
        items:
          type: string
          pattern: '^(ocorridaEm|acao|tipoRecurso)(,(asc|desc|ASC|DESC))?$'
    SortParticipacaoEvento:
      name: sort
      in: query
      description: "Pode ser repetido: `status` ou `inscritoEm`, com `asc` ou `desc`."
      schema:
        type: array
        items:
          type: string
          pattern: '^(status|inscritoEm)(,(asc|desc|ASC|DESC))?$'
